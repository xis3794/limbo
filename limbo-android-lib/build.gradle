apply plugin: 'com.android.library'

android {
    // The manifest no longer carries package="..."; AGP 8+ requires it here.
    namespace 'com.limbo.emu.lib'
    // AGP 9 resolves the integer 37 to the "android-37.0" platform hash, which
    // is the only API 37 revision the SDK ships (there is no android-37).
    compileSdkVersion 37
    buildToolsVersion '37.0.0'

    // Miuix 0.9.4 (the Compose UI toolkit used by limbo-android-exp) declares
    // minSdkVersion 24 in its manifest, so the library that will expose it has
    // to be at least 24 as well.
    defaultConfig{
        minSdkVersion 24
        targetSdkVersion 28
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 rejects 'proguard-android.txt' (it disables R8 optimisations).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

//    externalNativeBuild {
//        ndkBuild {
//            path 'src/main/jni/Android.mk'
//        }
//    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.preference:preference:1.1.1'
    // Pure-Java XZ decoder used by the downloadable QEMU version packages.
    implementation 'org.tukaani:xz:1.9'
    // NOTE: 'com.android.support:multidex:1.0.3' was dropped. Nothing in this
    // project references MultiDex (no MultiDexApplication, no install() call),
    // and support-library artefacts must not be mixed into an AndroidX build.
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.lifecycle:lifecycle-runtime:2.2.0"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.2.0"


}

tasks.all { task ->
    if (task.name.startsWith('compile') && task.name.endsWith('Ndk')) {
        task.enabled = false
    }
}
