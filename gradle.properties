# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# AGP 9 / Kotlin 2.4 need more than the old 2000m heap: the R8 + Kotlin
# compiler workers were running out of metaspace on the 4-module build.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.daemon=true
# config-on-demand is deprecated for AGP: the Android plugin needs all projects
# configured to build the variant graph, so keep it off.
org.gradle.configureondemand=false

# AGP 9 keeps the legacy DSL available only behind this flag. Every module in
# this repo is still written against the old `android { compileSdkVersion ... }`
# Groovy DSL, so it has to stay `false` until those are ported.
android.newDsl=false
# AGP 9 would otherwise apply its own Kotlin plugin to every Android module.
# limbo-android-exp applies the Kotlin plugin explicitly instead.
android.builtInKotlin=false
# `android.enableBuildCache` was removed in AGP 8 and
# `android.enableJetifier` is a no-op here (all dependencies are AndroidX
# already), so neither is set any more.
android.useAndroidX=true
android.nonTransitiveRClass=false
