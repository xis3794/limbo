apply plugin: 'com.android.application'

android {
    // The manifest no longer carries package="..."; AGP 8+ requires it here.
    namespace 'com.limbo.emu.main'
    // AGP 9 resolves the integer 37 to the "android-37.0" platform hash, which
    // is the only API 37 revision the SDK ships (there is no android-37).
    compileSdkVersion 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.limbo.emu.main"
        minSdkVersion 24
        targetSdkVersion 28
        ndk { abiFilters "arm64-v8a" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 rejects 'proguard-android.txt' (it disables R8 optimisations).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }
    lintOptions {
        abortOnError false
        disable 'MissingTranslation'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

}

dependencies {
//    implementation fileTree(include: ['*.jar,*.so'], dir: 'libs')
    implementation fileTree(dir: 'libs', include: ['.jar','.so'])

    implementation 'androidx.appcompat:appcompat:1.1.0'

    implementation project(':limbo-android-lib')

    // Experimental Kotlin/Compose UI (opt-in via ExpPrefs.experimentalUi).
    implementation project(':limbo-android-exp')
}
