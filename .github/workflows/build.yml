name: Build Limbo APK

on:
  workflow_dispatch:
    inputs:
      qemu_version:
        description: 'QEMU version to build (GTK4/GPU are built against 11.0.0 only)'
        required: true
        default: '11.0.0'
        type: choice
        options:
          - '5.1.0'
          - '8.0.5'
          - '10.2.0'
          - '11.0.0'
          - '11.1.0'
          - '11.1.2'
      build_host:
        description: 'Target device ABI (arm64-v8a recommended)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
      build_guest:
        description: 'Guest architecture'
        required: true
        default: 'x86_64-softmmu'
        type: choice
        options:
          - 'x86_64-softmmu'
          - 'aarch64-softmmu'
      use_gtk:
        description: 'Build the GTK4 display backend (ships libgtk-4.so in the APK)'
        required: true
        default: true
        type: boolean
      use_virgl:
        description: 'Build GPU acceleration (opengl + virglrenderer -> virtio-gpu-gl-pci)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      QEMU_VER: ${{ github.event.inputs.qemu_version || '11.0.0' }}
      BUILD_HOST: ${{ github.event.inputs.build_host || 'arm64-v8a' }}
      BUILD_GUEST: ${{ github.event.inputs.build_guest || 'x86_64-softmmu' }}
      # Boolean inputs arrive as the strings 'true'/'false'. Normalising them
      # here (rather than inside a step) keeps every later step free to just
      # test $USE_GTK without repeating the parsing.
      INPUT_USE_GTK: ${{ github.event.inputs.use_gtk || 'true' }}
      INPUT_USE_VIRGL: ${{ github.event.inputs.use_virgl || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build options
        run: |
          # The GTK4 display backend and the OpenGL/virglrenderer stack are
          # built from a QEMU tree the Android patches apply to. The GTK4 port
          # (patches/qemu-11.0.0-gtk4-android.patch) rewrites ui/gtk.c onto the
          # GTK4 API and switches meson's dependency from gtk+-3.0 to gtk4;
          # upstream 11.1.x restructured ui/gtk.c (GMenu + GPtrArray console
          # management) so that patch conflicts there and cannot be ported
          # mechanically. Rather than ship a half-patched engine, the two
          # optional stacks are pinned to a version they are known to apply
          # and build against, and refused elsewhere.
          GTK_VIRGL_QEMU_VER="11.0.0"

          USE_GTK="$INPUT_USE_GTK"
          USE_VIRGL="$INPUT_USE_VIRGL"
          [ "$USE_GTK" = "true" ] || USE_GTK=false
          [ "$USE_VIRGL" = "true" ] || USE_VIRGL=false

          if [ "$USE_GTK" = "true" ] || [ "$USE_VIRGL" = "true" ]; then
            if [ "$QEMU_VER" != "$GTK_VIRGL_QEMU_VER" ]; then
              echo "::warning::GTK4/GPU are only built against QEMU $GTK_VIRGL_QEMU_VER (requested $QEMU_VER); disabling both for this build."
              USE_GTK=false
              USE_VIRGL=false
            fi
          fi

          # GPU acceleration is GTK-independent in principle, but gtk4android's
          # libepoxy is one of its links and the CI builds them together; keep
          # the pair consistent so a --disable-gtk build never links half a GL
          # stack.
          if [ "$USE_GTK" != "true" ]; then USE_VIRGL=false; fi

          echo "USE_GTK=$USE_GTK"   >> $GITHUB_ENV
          echo "USE_VIRGL=$USE_VIRGL" >> $GITHUB_ENV
          echo "GTK_VIRGL_QEMU_VER=$GTK_VIRGL_QEMU_VER" >> $GITHUB_ENV
          echo "resolved: QEMU=$QEMU_VER host=$BUILD_HOST guest=$BUILD_GUEST gtk=$USE_GTK virgl=$USE_VIRGL"

      - name: Check preinstalled tools (no apt needed)
        run: |
          # ubuntu-latest preinstalls most tools; verify and install the
          # missing ones (meson/ninja) via pip (runner network is fine).
          for t in make gcc g++ git python3 pkg-config flex bison gettext texinfo \
                   rsync unzip zip wget curl autoconf automake libtool; do
            command -v $t >/dev/null 2>&1 || echo "MISSING: $t"
          done
          command -v meson || pip3 install --quiet --retries 5 meson ninja
          command -v ninja || pip3 install --quiet --retries 5 ninja
          command -v meson || { for i in 1 2 3; do pip3 install -i https://pypi.tuna.tsinghua.edu.cn/simple meson ninja && break || sleep 5; done; }
          meson --version || true
          ninja --version || true
          # glib 2.56 (QEMU 5.1/8.0.5) runs autogen.sh which needs gtkdocize
          sudo apt-get update -qq
          sudo apt-get install -y -qq gtk-doc-tools gettext libtool-bin
          # GTK's build runs GLib helper programs (glib-compile-resources and
          # friends) on the build machine - they must be host binaries, not the
          # aarch64 ones cross-compiled for the target (that gives
          # "Exec format error"). gtk4android is configured with a native_file
          # that points at the host pkg-config, so these have to exist here.
          sudo apt-get install -y -qq libglib2.0-dev-bin
          command -v glib-compile-resources && glib-compile-resources --version || true
          command -v gtkdocize && echo "gtkdocize OK"
          command -v msgfmt && echo "msgfmt OK"
          echo "tool check done"
          # patchelf >= 0.18 needed for --replace-symbol (rename _rwlock_*
          # to pthread_rwlock_* in glib/qemu so Huawei linker can resolve
          # them against libc's standard-name version definitions)
          curl -sL --retry 5 --retry-delay 3 -o /tmp/patchelf018.tgz \
            https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz
          mkdir -p /tmp/p018
          tar xzf /tmp/patchelf018.tgz -C /tmp/p018 --strip-components=1 --no-same-owner --no-overwrite-dir
          sudo cp /tmp/p018/bin/patchelf /usr/local/bin/
          patchelf --version

      - name: Set up JDK 11 (for Gradle build)
        id: jdk11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17 (for sdkmanager)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 29 + build-tools 29.0.3)
        env:
          JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Set up NDK r23b
        run: |
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip
          echo "NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r23b" >> $GITHUB_ENV

      - name: Download QEMU and dependency sources
        run: |
          cd limbo-android-lib/src/main/jni
          # QEMU
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://download.qemu.org/qemu-$QEMU_VER.tar.xz
          tar xf qemu-$QEMU_VER.tar.xz && mv qemu-$QEMU_VER qemu && rm qemu-$QEMU_VER.tar.xz
          # glib 2.56.1
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz
          tar xf glib-2.56.1.tar.xz && mv glib-2.56.1 glib && rm glib-2.56.1.tar.xz
          # libffi 3.3
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://github.com/libffi/libffi/releases/download/v3.3/libffi-3.3.tar.gz
          tar xzf libffi-3.3.tar.gz && mv libffi-3.3 libffi && rm libffi-3.3.tar.gz
          # pixman 0.40.0
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://www.cairographics.org/releases/pixman-0.40.0.tar.gz
          tar xzf pixman-0.40.0.tar.gz && mv pixman-0.40.0 pixman && rm pixman-0.40.0.tar.gz
          # SDL2 2.0.8
          wget -q https://www.libsdl.org/release/SDL2-2.0.8.tar.gz
          tar xzf SDL2-2.0.8.tar.gz && mv SDL2-2.0.8 SDL2 && rm SDL2-2.0.8.tar.gz
          # dtc (libfdt) — QEMU 8.x requires it; tarball lacks the submodule
          if [ "$QEMU_VER" = "8.0.5" ]; then
            wget -q https://gitlab.com/qemu-project/dtc/-/archive/v1.7.0/dtc-v1.7.0.tar.gz
            tar xzf dtc-v1.7.0.tar.gz && mv dtc-v1.7.0 qemu/dtc && rm dtc-v1.7.0.tar.gz
            echo "dtc/libfdt v1.7.0 installed as qemu/dtc/"
          fi

      - name: Download GTK4 / libepoxy / virglrenderer sources
        if: env.USE_GTK == 'true' || env.USE_VIRGL == 'true'
        run: |
          cd limbo-android-lib/src/main/jni

          # libepoxy: the GL/EGL function loader QEMU's CONFIG_OPENGL and
          # virglrenderer both link against. Built on its own so GPU
          # acceleration does not depend on the GTK stack building.
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 \
            https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz -O libepoxy.tar.gz
          tar xzf libepoxy.tar.gz && mv libepoxy-1.5.10 libepoxy && rm libepoxy.tar.gz

          # virglrenderer: host side renderer behind virtio-gpu-gl-pci.
          git clone --depth 1 --branch 1.1.0 --single-branch \
            https://gitlab.freedesktop.org/virgl/virglrenderer.git virglrenderer

          if [ "$USE_GTK" = "true" ]; then
            # gtk4android: the GTK tree carrying the GDK "android" backend.
            # Its meson wraps (cairo/pango/harfbuzz/freetype/fontconfig/...) are
            # fetched by meson itself during `meson setup`.
            git clone --depth 1 --branch master --single-branch \
              https://github.com/SlugAir928437/gtk4android.git gtk4android
            echo ">> gtk4android: $(git -C gtk4android rev-parse --short HEAD)"

            # GTK requires GLib >= 2.84 while QEMU links Limbo's 2.76.6, so the
            # GTK stack gets its own 2.89.3 build (see scripts/build_glib289.sh).
            # A tag, not the moving GMain default branch.
            #
            # GitHub's mirror comes first: gitlab.gnome.org intermittently
            # answers 503, and a failed clone here aborts the whole build before
            # anything else runs. Upstream GitLab stays as the fallback.
            GLIB_CLONED=0
            for attempt in 1 2 3; do
              for url in https://github.com/GNOME/glib.git https://gitlab.gnome.org/GNOME/glib.git; do
                if git clone --depth 1 --branch 2.89.3 --single-branch "$url" glib289; then
                  echo ">> glib (GTK stack) from $url"
                  GLIB_CLONED=1
                  break
                fi
                rm -rf glib289
                echo ">> glib clone failed ($url), attempt $attempt"
              done
              [ "$GLIB_CLONED" = "1" ] && break
              sleep 10
            done
            if [ "$GLIB_CLONED" != "1" ]; then
              echo "::error::could not fetch glib 2.89.3 from GitHub or GitLab after 3 attempts"
              exit 1
            fi
            echo ">> glib (GTK stack): $(git -C glib289 describe --tags --always)"
          fi

          echo ">> libepoxy/libvirglrenderer sources ready"

      - name: Apply patches & prepare QEMU
        run: |
          cd limbo-android-lib/src/main/jni
          case "$QEMU_VER" in
            10.*|11.*)
            echo "=== Running QEMU $QEMU_VER Limbo/Android adaptation (meson pipeline) ==="
            python3 "$GITHUB_WORKSPACE/scripts/fix_qemu11.py" "$PWD"
            echo "=== Downloading glib 2.76.6 (meson build, needed by QEMU 9+) ==="
            wget -q https://download.gnome.org/sources/glib/2.76/glib-2.76.6.tar.xz
            tar xf glib-2.76.6.tar.xz && mv glib-2.76.6 glib276 && rm glib-2.76.6.tar.xz
            echo "=== Downloading libslirp 4.7.0 (built later inside make limbo) ==="
            cp "$GITHUB_WORKSPACE/tools/libslirp-4.7.0.tar.gz" .
            tar xzf libslirp-4.7.0.tar.gz && mv libslirp-v4.7.0 libslirp && rm libslirp-4.7.0.tar.gz
            echo "=== Downloading dtc/libfdt ==="
            wget -q --tries=5 --retry-connrefused --waitretry=5 https://gitlab.com/qemu-project/dtc/-/archive/v1.7.0/dtc-v1.7.0.tar.gz
            tar xzf dtc-v1.7.0.tar.gz && mv dtc-v1.7.0 qemu/dtc && rm dtc-v1.7.0.tar.gz
            ;;
            8.0.5)
            echo "=== Running QEMU 8.0.5 Limbo/Android adaptation ==="
            python3 "$GITHUB_WORKSPACE/scripts/fix_qemu805.py" "$PWD"
            echo "=== Downloading libslirp 4.7.0 (built later inside make limbo) ==="
            cp "$GITHUB_WORKSPACE/tools/libslirp-4.7.0.tar.gz" .
            tar xzf libslirp-4.7.0.tar.gz && mv libslirp-v4.7.0 libslirp && rm libslirp-4.7.0.tar.gz
            ;;
            *)
            cd qemu && patch -p1 < ../patches/qemu-$QEMU_VER.patch && cd ..
            if [ "$QEMU_VER" = "5.1.0" ]; then
              # bionic has no malloc_trim: stub it out in rcu.c
              sed -i 's/^#ifdef CONFIG_MALLOC_TRIM/#if 0 \/* CONFIG_MALLOC_TRIM *\//' qemu/util/rcu.c
              echo "rcu.c malloc_trim disabled for Android"
            fi
            ;;
          esac
          cd glib && patch -p1 < ../patches/glib-2.56.1.patch && cd ..
          cd SDL2 && patch -p1 < ../patches/sdl2-2.0.8.patch && cd ..

      - name: Build native libraries (make limbo)
        run: |
          cd limbo-android-lib/src/main/jni
          export NDK_ROOT="$NDK_ROOT"
          export BUILD_HOST="$BUILD_HOST"
          export BUILD_GUEST="$BUILD_GUEST"
          export USE_QEMU_VERSION="$QEMU_VER"
          # Optional display stacks, resolved by the "Resolve build options"
          # step (GTK4/GPU are pinned to the QEMU version their patches apply to).
          export USE_GTK="$USE_GTK"
          export USE_VIRGL="$USE_VIRGL"
          export USE_VIRGL_VENUS="${USE_VIRGL_VENUS:-false}"
          if [ "$QEMU_VER" = "8.0.5" ]; then
            export PKG_CONFIG_PATH="$PWD/pc"
          fi
          echo "=== DIAG CHECK BEFORE ==="
          grep -c 'so-libs' compat/diag/diag.c || true
          md5sum compat/diag/diag.c || true
          # FORCE clean rebuild of ALL ndk modules (multiple ndk-build runs
          # inside make limbo were reusing stale .o files, so libdiag.so
          # never got the new so-libs code)
          echo "=== FORCE CLEAN obj/local (ndk-build full rebuild) ==="
          rm -rf "$PWD/../obj/local"
          # V=1 makes ndk-build print the FULL compiler command lines so we
          # can see exactly which diag.c is being compiled
          export NDK_BUILD_FLAGS="V=1"
          make limbo
          echo "=== DIAG CHECK AFTER SOURCE ==="
          grep -c 'so-libs' compat/diag/diag.c || true
          md5sum compat/diag/diag.c || true
          echo "=== DIAG CHECK AFTER (obj/local) ==="
          ls -la "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          grep -c 'so-libs' "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          md5sum "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          echo "=== FORCE copy new libdiag.so to libs/ + jniLibs/ ==="
          cp -f "$PWD/../obj/local/arm64-v8a/libdiag.so" "$PWD/../libs/arm64-v8a/libdiag.so" 2>/dev/null || true
          cp -f "$PWD/../obj/local/arm64-v8a/libdiag.so" "$PWD/../jniLibs/arm64-v8a/libdiag.so" 2>/dev/null || true
          echo "=== DIAG CHECK AFTER (libs) ==="
          grep -c 'so-libs' "$PWD/../libs/arm64-v8a/libdiag.so" 2>/dev/null || true
          md5sum "$PWD/../libs/arm64-v8a/libdiag.so" 2>/dev/null || true
          echo "=== DIAG CHECK ndk-build history ==="
          find "$PWD/../obj/local" -name '*.o' -path '*diag*' 2>/dev/null | head -5
          ls -la "$PWD/../obj/local/arm64-v8a/objs/diag/" 2>/dev/null | head -10
          echo "=== DIAG.o so-libs check (compile source verification) ==="
          grep -c 'so-libs' "$PWD/../obj/local/arm64-v8a/objs/diag/diag.o" 2>/dev/null || true
          echo "=== diag.o strings ==="
          strings -a "$PWD/../obj/local/arm64-v8a/objs/diag/diag.o" 2>/dev/null | grep -E 'so-libs|NATIVE CRASH|proc/self/maps' | head -5
          echo "=== diag.c in git tree ==="
          git -C "$GITHUB_WORKSPACE" log --oneline -1 2>/dev/null || true
          md5sum "$PWD/compat/diag/diag.c" 2>/dev/null || true
          echo "=== Android.mk diag module ==="
          cat "$PWD/compat/diag/Android.mk" 2>/dev/null || true
          echo "=== check ALL diag.c files ==="
          find "$PWD" -name 'diag.c' 2>/dev/null | head -5

      - name: Install extra EFI firmware (OVMF / VMWARE_EFI)
        run: |
          # Unpack Plus-style EFI firmwares into all module assets
          for mod in limbo-android-x86 limbo-android-arm limbo-android-ppc limbo-android-sparc; do
            mkdir -p "$mod/src/main/assets/roms"
            unzip -o -q tools/firmware/firmware.zip -d "$mod/src/main/assets/roms/"
          done
          echo "EFI firmware installed:"; ls -la limbo-android-x86/src/main/assets/roms/*.fd

      - name: Verify BIOS/ROM assets are present (fail fast)
        run: |
          # QEMU cannot start without bios.bin / vgabios*.bin in the -L dir.
          # These come from qemu/pc-bios via the Makefile COPY_ROMS rule, which
          # was silently broken once (cp had no destination) and shipped an APK
          # with only OVMF*.fd -> QEMU exited instantly and the app crashed.
          MISSING=0
          for f in bios.bin bios-256k.bin vgabios-stdvga.bin kvmvapic.bin; do
            for d in limbo-android-lib/src/main/assets/roms limbo-android-x86/src/main/assets/roms; do
              if [ ! -f "$d/$f" ]; then
                echo "::error::MISSING $d/$f (BIOS assets not copied into the APK!)"
                MISSING=1
              fi
            done
          done
          echo "=== pc-bios assets in module ==="
          ls -la limbo-android-x86/src/main/assets/roms/ | head -40
          echo "=== total files in assets/roms ==="
          ls limbo-android-x86/src/main/assets/roms/ | wc -l
          if [ "$MISSING" = "1" ]; then
            echo "::error::BIOS assets missing; aborting build (APK would not boot QEMU)"
            exit 1
          fi
          echo "OK: BIOS assets present"

      - name: Verify GTK4 / GPU artifacts (fail fast)
        if: env.USE_GTK == 'true' || env.USE_VIRGL == 'true'
        run: |
          # The Java side decides whether to offer the GTK backend and the
          # virtio-gpu-gl devices purely by the presence of these libraries
          # (see DisplayBackendProbe). If the native build produced them but
          # they were not carried into jniLibs, the APK would silently keep
          # offering only VNC/SDL -- or worse, offer GTK and then fail at
          # start up. Fail here instead of shipping that.
          OBJ=limbo-android-lib/src/main/jni/../obj/local/$BUILD_HOST
          # Two different jniLibs trees exist and only one is a bug to miss:
          #   * limbo-android-x86/src/main/jniLibs gets libqemu-system-*.so only
          #     (SYNC_LIBS_X86), the engine this APK actually loads;
          #   * limbo-android-lib/src/main/jniLibs is the library module's own
          #     tree, which AGP packages into the APK as well, and that is where
          #     INSTALL_LIBS/SYNC_LIBS put every dependency .so (libgtk-4,
          #     libepoxy, libvirglrenderer and their transitive deps).
          # Checking the app module for the GTK libs therefore always failed
          # even when the build was correct.
          LIBS=limbo-android-lib/src/main/jniLibs/$BUILD_HOST
          MISSING=0

          check() {
            if [ -f "$OBJ/$1" ]; then
              echo "obj:     $1"
            else
              echo "::error::native build did not produce $OBJ/$1"
              MISSING=1
            fi
          }

          [ "$USE_VIRGL" = "true" ] && check libepoxy.so
          [ "$USE_VIRGL" = "true" ] && check libvirglrenderer.so
          [ "$USE_GTK" = "true" ]   && check libgtk-4.so

          echo "=== QEMU DT_NEEDED ==="
          readelf -d "$OBJ/libqemu-system-x86_64.so" 2>/dev/null | grep NEEDED | sed 's/^/  /' || true
          if [ "$USE_VIRGL" = "true" ]; then
            readelf -d "$OBJ/libqemu-system-x86_64.so" 2>/dev/null | grep -q 'libepoxy' \
              || { echo "::error::libqemu-system-x86_64.so does not link libepoxy (CONFIG_OPENGL was not enabled)"; MISSING=1; }
            readelf -d "$OBJ/libqemu-system-x86_64.so" 2>/dev/null | grep -q 'libvirglrenderer' \
              || { echo "::error::libqemu-system-x86_64.so does not link libvirglrenderer (CONFIG_VIRGL was not enabled)"; MISSING=1; }
          fi
          if [ "$USE_GTK" = "true" ]; then
            readelf -d "$OBJ/libqemu-system-x86_64.so" 2>/dev/null | grep -q 'libgtk-4' \
              || { echo "::error::libqemu-system-x86_64.so does not link libgtk-4 (CONFIG_GTK was not enabled)"; MISSING=1; }
            [ -f "$OBJ/virglrenderer/install-android/lib/pkgconfig/virglrenderer.pc" ] || true
          fi

          echo "=== jniLibs (goes into the APK) ==="
          ls -la "$LIBS" 2>/dev/null | head -40 || echo "(empty)"
          if [ "$USE_GTK" = "true" ] && [ ! -f "$LIBS/libgtk-4.so" ]; then
            echo "::error::libgtk-4.so missing from jniLibs (it would not ship in the APK)"
            MISSING=1
          fi
          if [ "$USE_VIRGL" = "true" ] && [ ! -f "$LIBS/libvirglrenderer.so" ]; then
            echo "::error::libvirglrenderer.so missing from jniLibs (it would not ship in the APK)"
            MISSING=1
          fi

          if [ "$MISSING" = "1" ]; then
            echo "::error::GTK4/GPU artifacts incomplete; aborting (would ship an APK that cannot use them)"
            exit 1
          fi
          echo "OK: GTK4/GPU artifacts present"

          # Every DT_NEEDED entry that points at one of our own libraries must
          # have a file with that exact name next to it in the APK's lib dir:
          # Android's linker resolves them against a flat directory by exact
          # file name, and libqemu-system-*.so is dlopen()ed at runtime, so a
          # single missing entry makes the engine fail to load and the app
          # shows no screen at all (SDL, VNC and GTK alike) with no log line.
          #
          # This is exactly how GLib 2.89 broke the build: it ships gobject and
          # gio as separate .so files (2.76 had them inside libglib-2.0.so) and
          # nothing staged them, so libqemu needed libgio-2.0.so.0 and
          # libgobject-2.0.so.0 that were not in the APK.
          echo "=== checking every DT_NEEDED of the shipped libraries ==="
          # A standalone script rather than an inline heredoc: the YAML
          # block scalar made the indentation fragile and github rejected the
          # whole workflow file when it did not round-trip.
          python3 "$GITHUB_WORKSPACE/scripts/check_shipped_needed.py" "$OBJ"

          # The gate above proves every depended-on *library* is shipped. This
          # one proves every depended-on *symbol* is provided by something in
          # the APK or by the Android platform. Both are needed, because
          # shipping libintl.so is not enough if it is the wrong libintl.so.
          #
          # That is exactly how a release shipped with SDL, VNC and GTK all
          # dead: the GTK build's own proxy-libintl overwrote the ndk-build
          # libintl.so that carries the C23 sized-free stubs, and
          # libglib-2.0.so has a real global reference to free_sized, so dlopen
          # of the engine failed with "cannot locate symbol free_sized" before
          # QEMU ever ran.
          echo "=== checking that every referenced symbol resolves ==="
          python3 "$GITHUB_WORKSPACE/scripts/check_resolvable_symbols.py" \
            "$OBJ" "$NDK_ROOT"

      - name: Build APK with Gradle 7.0.2
        env:
          JAVA_HOME: ${{ steps.jdk11.outputs.path }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.0.2-bin.zip
          unzip -q gradle-7.0.2-bin.zip
          ./gradle-7.0.2/bin/gradle :limbo-android-x86:assembleRelease --no-daemon

      - name: Sign APK with debug keystore
        run: |
          # Use the FIXED keystore committed to the repo (tools/keys/debug.keystore).
          # IMPORTANT: every build must produce the SAME signature, otherwise
          # users cannot install updates over an existing install.
          KEYSTORE="$GITHUB_WORKSPACE/tools/keys/debug.keystore"
          # Find the unsigned APK
          APK=$(find limbo-android-x86/build/outputs/apk/release -name "*-release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find limbo-android-x86/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          echo "Signing: $APK"
          SIGNED_APK="${APK%-unsigned.apk}-signed.apk"
          # Use apksigner from build-tools
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out "$SIGNED_APK" "$APK"
          echo "Signed APK: $SIGNED_APK"
          ls -la "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: limbo-x86-${{ env.QEMU_VER }}-${{ env.BUILD_HOST }}
          path: limbo-android-x86/build/outputs/apk/release/*-signed.apk
