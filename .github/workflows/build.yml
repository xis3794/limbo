name: Build Limbo APK

on:
  workflow_dispatch:
    inputs:
      qemu_version:
        description: 'QEMU version to build'
        required: true
        default: '11.1.0'
        type: choice
        options:
          - '5.1.0'
          - '8.0.5'
          - '11.1.0'
      build_host:
        description: 'Target device ABI (arm64-v8a recommended)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'armeabi-v7a'
      build_guest:
        description: 'Guest architecture'
        required: true
        default: 'x86_64-softmmu'
        type: choice
        options:
          - 'x86_64-softmmu'
          - 'aarch64-softmmu'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      QEMU_VER: ${{ github.event.inputs.qemu_version || '5.1.0' }}
      BUILD_HOST: ${{ github.event.inputs.build_host || 'arm64-v8a' }}
      BUILD_GUEST: ${{ github.event.inputs.build_guest || 'x86_64-softmmu' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check preinstalled tools (no apt needed)
        run: |
          # ubuntu-latest preinstalls most tools; verify and install the
          # missing ones (meson/ninja) via pip (runner network is fine).
          for t in make gcc g++ git python3 pkg-config flex bison gettext texinfo \
                   rsync unzip zip wget curl autoconf automake libtool; do
            command -v $t >/dev/null 2>&1 || echo "MISSING: $t"
          done
          command -v meson || pip3 install --quiet --retries 5 meson ninja
          command -v ninja || pip3 install --quiet --retries 5 ninja
          command -v meson || { for i in 1 2 3; do pip3 install -i https://pypi.tuna.tsinghua.edu.cn/simple meson ninja && break || sleep 5; done; }
          meson --version || true
          ninja --version || true
          echo "tool check done"
          # patchelf >= 0.18 needed for --replace-symbol (rename _rwlock_*
          # to pthread_rwlock_* in glib/qemu so Huawei linker can resolve
          # them against libc's standard-name version definitions)
          curl -sL --retry 5 --retry-delay 3 -o /tmp/patchelf018.tgz \
            https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz
          mkdir -p /tmp/p018
          tar xzf /tmp/patchelf018.tgz -C /tmp/p018 --strip-components=1 --no-same-owner --no-overwrite-dir
          sudo cp /tmp/p018/bin/patchelf /usr/local/bin/
          patchelf --version

      - name: Set up JDK 11 (for Gradle build)
        id: jdk11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up JDK 17 (for sdkmanager)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 29 + build-tools 29.0.3)
        env:
          JAVA_HOME: ${{ steps.jdk17.outputs.path }}
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Set up NDK r23b
        run: |
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip
          echo "NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r23b" >> $GITHUB_ENV

      - name: Download QEMU and dependency sources
        run: |
          cd limbo-android-lib/src/main/jni
          # QEMU
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://download.qemu.org/qemu-$QEMU_VER.tar.xz
          tar xf qemu-$QEMU_VER.tar.xz && mv qemu-$QEMU_VER qemu && rm qemu-$QEMU_VER.tar.xz
          # glib 2.56.1
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz
          tar xf glib-2.56.1.tar.xz && mv glib-2.56.1 glib && rm glib-2.56.1.tar.xz
          # libffi 3.3
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://github.com/libffi/libffi/releases/download/v3.3/libffi-3.3.tar.gz
          tar xzf libffi-3.3.tar.gz && mv libffi-3.3 libffi && rm libffi-3.3.tar.gz
          # pixman 0.40.0
          wget -q --timeout=60 --tries=5 --retry-connrefused --waitretry=5 https://www.cairographics.org/releases/pixman-0.40.0.tar.gz
          tar xzf pixman-0.40.0.tar.gz && mv pixman-0.40.0 pixman && rm pixman-0.40.0.tar.gz
          # SDL2 2.0.8
          wget -q https://www.libsdl.org/release/SDL2-2.0.8.tar.gz
          tar xzf SDL2-2.0.8.tar.gz && mv SDL2-2.0.8 SDL2 && rm SDL2-2.0.8.tar.gz
          # dtc (libfdt) — QEMU 8.x requires it; tarball lacks the submodule
          if [ "$QEMU_VER" = "8.0.5" ]; then
            wget -q https://gitlab.com/qemu-project/dtc/-/archive/v1.7.0/dtc-v1.7.0.tar.gz
            tar xzf dtc-v1.7.0.tar.gz && mv dtc-v1.7.0 qemu/dtc && rm dtc-v1.7.0.tar.gz
            echo "dtc/libfdt v1.7.0 installed as qemu/dtc/"
          fi

      - name: Apply patches & prepare QEMU
        run: |
          cd limbo-android-lib/src/main/jni
          if [ "$QEMU_VER" = "11.1.0" ]; then
            echo "=== Running QEMU 11.1.0 Limbo/Android adaptation ==="
            python3 "$GITHUB_WORKSPACE/scripts/fix_qemu11.py" "$PWD"
            echo "=== Downloading glib 2.76.6 (meson build, needed by QEMU11) ==="
            wget -q https://download.gnome.org/sources/glib/2.76/glib-2.76.6.tar.xz
            tar xf glib-2.76.6.tar.xz && mv glib-2.76.6 glib276 && rm glib-2.76.6.tar.xz
            echo "=== Downloading libslirp 4.7.0 (built later inside make limbo) ==="
            cp "$GITHUB_WORKSPACE/tools/libslirp-4.7.0.tar.gz" .
            tar xzf libslirp-4.7.0.tar.gz && mv libslirp-v4.7.0 libslirp && rm libslirp-4.7.0.tar.gz
            echo "=== Downloading dtc/libfdt ==="
            wget -q --tries=5 --retry-connrefused --waitretry=5 https://gitlab.com/qemu-project/dtc/-/archive/v1.7.0/dtc-v1.7.0.tar.gz
            tar xzf dtc-v1.7.0.tar.gz && mv dtc-v1.7.0 qemu/dtc && rm dtc-v1.7.0.tar.gz
          elif [ "$QEMU_VER" = "8.0.5" ]; then
            echo "=== Running QEMU 8.0.5 Limbo/Android adaptation ==="
            python3 "$GITHUB_WORKSPACE/scripts/fix_qemu805.py" "$PWD"
            echo "=== Downloading libslirp 4.7.0 (built later inside make limbo) ==="
            cp "$GITHUB_WORKSPACE/tools/libslirp-4.7.0.tar.gz" .
            tar xzf libslirp-4.7.0.tar.gz && mv libslirp-v4.7.0 libslirp && rm libslirp-4.7.0.tar.gz
          else
            cd qemu && patch -p1 < ../patches/qemu-$QEMU_VER.patch && cd ..
            if [ "$QEMU_VER" = "5.1.0" ]; then
              # bionic has no malloc_trim: stub it out in rcu.c
              sed -i 's/^#ifdef CONFIG_MALLOC_TRIM/#if 0 \/* CONFIG_MALLOC_TRIM *\//' qemu/util/rcu.c
              echo "rcu.c malloc_trim disabled for Android"
            fi
          fi
          cd glib && patch -p1 < ../patches/glib-2.56.1.patch && cd ..
          cd SDL2 && patch -p1 < ../patches/sdl2-2.0.8.patch && cd ..

      - name: Build native libraries (make limbo)
        run: |
          cd limbo-android-lib/src/main/jni
          export NDK_ROOT="$NDK_ROOT"
          export BUILD_HOST="$BUILD_HOST"
          export BUILD_GUEST="$BUILD_GUEST"
          export USE_QEMU_VERSION="$QEMU_VER"
          if [ "$QEMU_VER" = "8.0.5" ]; then
            export PKG_CONFIG_PATH="$PWD/pc"
          fi
          echo "=== DIAG CHECK BEFORE ==="
          grep -c 'so-libs' compat/diag/diag.c || true
          md5sum compat/diag/diag.c || true
          make limbo
          echo "=== DIAG CHECK AFTER SOURCE ==="
          grep -c 'so-libs' compat/diag/diag.c || true
          md5sum compat/diag/diag.c || true
          echo "=== DIAG CHECK AFTER (obj/local) ==="
          ls -la "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          grep -c 'so-libs' "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          md5sum "$PWD/../obj/local/arm64-v8a/libdiag.so" 2>/dev/null || true
          echo "=== DIAG CHECK AFTER (libs) ==="
          grep -c 'so-libs' "$PWD/../libs/arm64-v8a/libdiag.so" 2>/dev/null || true
          md5sum "$PWD/../libs/arm64-v8a/libdiag.so" 2>/dev/null || true
          echo "=== DIAG CHECK ndk-build history ==="
          find "$PWD/../obj/local" -name '*.o' -path '*diag*' 2>/dev/null | head -5
          ls -la "$PWD/../obj/local/arm64-v8a/objs/diag/" 2>/dev/null | head -10

      - name: Install extra EFI firmware (OVMF / VMWARE_EFI)
        run: |
          # Unpack Plus-style EFI firmwares into all module assets
          for mod in limbo-android-x86 limbo-android-arm limbo-android-ppc limbo-android-sparc; do
            mkdir -p "$mod/src/main/assets/roms"
            unzip -o -q tools/firmware/firmware.zip -d "$mod/src/main/assets/roms/"
          done
          echo "EFI firmware installed:"; ls -la limbo-android-x86/src/main/assets/roms/*.fd

      - name: Build APK with Gradle 7.0.2
        env:
          JAVA_HOME: ${{ steps.jdk11.outputs.path }}
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.0.2-bin.zip
          unzip -q gradle-7.0.2-bin.zip
          ./gradle-7.0.2/bin/gradle :limbo-android-x86:assembleRelease --no-daemon

      - name: Sign APK with debug keystore
        run: |
          # Use the FIXED keystore committed to the repo (tools/keys/debug.keystore).
          # IMPORTANT: every build must produce the SAME signature, otherwise
          # users cannot install updates over an existing install.
          KEYSTORE="$GITHUB_WORKSPACE/tools/keys/debug.keystore"
          # Find the unsigned APK
          APK=$(find limbo-android-x86/build/outputs/apk/release -name "*-release-unsigned.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find limbo-android-x86/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          echo "Signing: $APK"
          SIGNED_APK="${APK%-unsigned.apk}-signed.apk"
          # Use apksigner from build-tools
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/29.0.3/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out "$SIGNED_APK" "$APK"
          echo "Signed APK: $SIGNED_APK"
          ls -la "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: limbo-x86-${{ env.QEMU_VER }}-${{ env.BUILD_HOST }}
          path: limbo-android-x86/build/outputs/apk/release/*-signed.apk
