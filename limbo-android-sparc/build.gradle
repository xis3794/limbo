apply plugin: 'com.android.application'

android {
    // The manifest no longer carries package="..."; AGP 8+ requires it here.
    namespace 'com.limbo.emu.main.sparc'
    // AGP 9 resolves the integer 37 to the "android-37.0" platform hash, which
    // is the only API 37 revision the SDK ships (there is no android-37).
    compileSdkVersion 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.limbo.emu.main.sparc"
        // Raised from 21 to 24: this module consumes :limbo-android-lib, whose
        // minSdk is 24 (Miuix 0.9.4 requires it), and the manifest merger
        // rejects a consumer with a lower minSdk than one of its libraries.
        minSdkVersion 24
        targetSdkVersion 28
        ndk { abiFilters "armeabi-v7a","arm64-v8a", "x86", "x86_64" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            // AGP 9 rejects 'proguard-android.txt' (it disables R8 optimisations).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    lintOptions {
        abortOnError false
        disable 'MissingTranslation'
    }
    // Native libraries have to be extracted at install time.
    //
    // AGP 8+ defaults `extractNativeLibs` to false once minSdk >= 23: the .so
    // stay inside the APK and ApplicationInfo.nativeLibraryDir is left empty.
    // That breaks two things in this app:
    //   * DisplayBackendProbe looks for libgtk-4.so / libvirglrenderer.so /
    //     libepoxy.so in nativeLibraryDir to decide whether the engine can do
    //     GTK and virgl. With an empty directory it concludes the feature is
    //     missing and silently disables GTK, so the GTK display never starts.
    //   * VMExecutor and FileUtils.getNativeLibDir() build absolute library
    //     paths from the same directory.
    // The APKs shipped before the AGP 9 migration (minSdk 21) were extracted,
    // which is why they are ~30 MB zipped instead of ~37 MB.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.1.0'

    implementation project(':limbo-android-lib')
}
